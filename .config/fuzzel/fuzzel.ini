# Ported from ~/.config/rofi/config.rasi

include=~/.config/fuzzel/themes/current.ini

[main]
# NOTE: fuzzel uses fontconfig syntax (:size=N), NOT rofi's pango syntax
# ("Family 24" — the trailing number is parsed as another family and the
# size silently defaults to ~16px). "JetBrainsMono Nerd Font" is not
# installed (removed Oct 21); the real family is "JetBrains Mono Medium".
font=JetBrains Mono Medium:size=16
icon-theme=Papirus
icons-enabled=yes
terminal=ghostty -e
# Sizing fonts via the monitor's reported DPI halves the text size on this
# setup (fuzzel derived ~46 DPI from EDID). Point sizes are relative to a
# fixed 96 DPI instead — same as rofi.
dpi-aware=no

# rofi: location north, y-offset 80px — width/height are scaled up from rofi
# width is in characters: 53 chars @ 24pt JetBrainsMono ≈ 1024px
# (chars rescaled on font changes so the window keeps ~1024px)
anchor=top
y-margin=80
width=50
lines=13

# rofi: entry padding 12, element padding 8 12 (fuzzel has one window
# padding plus a gap between prompt and list, so this is approximate)
horizontal-pad=12
vertical-pad=8
inner-pad=8
# ~10px breathing room above/below each entry (default metrics ≈43px rows).
# NOTE: line-height is in POINTS (scaled by 96/72 like font pt): 39pt → 52px.
line-height=39

# rofi: display-drun "  " — blank prompt
prompt=""

# rofi doesn't show a large icon when few entries match
image-size-ratio=0

[border]
# rofi: border 3, radius 5, border-color #000000
width=3
radius=5
